<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="title desc">
  <title id="title">High plank</title>
  <desc id="desc">Detailed side view of a high plank with straight body alignment, articulated arms, open hands, legs, and feet.</desc>
  <rect width="320" height="180" rx="24" fill="#18211b"/>
  <path d="M28 149H292" stroke="#4d6355" stroke-width="8" stroke-linecap="round"/>

  <!-- alignment guide -->
  <path d="M91 76L188 101L274 137" stroke="#8fd8ff" stroke-width="3" stroke-dasharray="7 7" stroke-linecap="round" opacity=".8"/>

  <!-- rear arm and hand -->
  <path d="M106 88L101 115L96 140" fill="none" stroke="#aeb8b1" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="101" cy="115" r="5" fill="#8fd8ff"/>
  <ellipse cx="91" cy="143" rx="14" ry="6" fill="#8fd8ff" stroke="#f6f7ef" stroke-width="2"/>

  <!-- torso, hip, far leg, and foot -->
  <path d="M102 84L187 103" stroke="#f6f7ef" stroke-width="21" stroke-linecap="round"/>
  <circle cx="187" cy="103" r="11" fill="#d7ff62" stroke="#f6f7ef" stroke-width="3"/>
  <path d="M187 104L244 131L271 141" fill="none" stroke="#aeb8b1" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M267 139L288 143L279 149H260Z" fill="#d7ff62" stroke="#f6f7ef" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- near leg and foot -->
  <path d="M188 101L238 126L263 139" fill="none" stroke="#f6f7ef" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="238" cy="126" r="6" fill="#d7ff62" stroke="#f6f7ef" stroke-width="2"/>
  <path d="M261 137L284 141L276 149H254Z" fill="#d7ff62" stroke="#f6f7ef" stroke-width="3" stroke-linejoin="round"/>

  <!-- near arm, elbow, wrist, palm, and fingers -->
  <path d="M110 88L119 114L116 140" fill="none" stroke="#f6f7ef" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="119" cy="114" r="6" fill="#8fd8ff" stroke="#f6f7ef" stroke-width="2"/>
  <circle cx="116" cy="140" r="5" fill="#8fd8ff"/>
  <ellipse cx="111" cy="144" rx="16" ry="7" fill="#8fd8ff" stroke="#f6f7ef" stroke-width="2"/>
  <path d="M100 142L91 139M100 145L90 145M101 148L93 151" stroke="#f6f7ef" stroke-width="2.5" stroke-linecap="round"/>

  <!-- head and neck -->
  <path d="M99 85L91 81" stroke="#f6f7ef" stroke-width="9" stroke-linecap="round"/>
  <circle cx="76" cy="75" r="19" fill="#d7ff62" stroke="#f6f7ef" stroke-width="4"/>
  <circle cx="66" cy="73" r="2.5" fill="#18211b"/>
  <path d="M60 78L53 81L61 83" fill="none" stroke="#18211b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- contact cues -->
  <path d="M88 153H129M253 153H290" stroke="#8fd8ff" stroke-width="3" stroke-linecap="round" opacity=".8"/>
</svg>
