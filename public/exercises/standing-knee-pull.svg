<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="title desc">
  <title id="title">Animated alternating standing knee pull</title>
  <desc id="desc">A standing figure alternates drawing each knee toward the hands while keeping the torso tall.</desc>
  <style>
    .left { animation: left-pose 2.4s ease-in-out infinite; }
    .right { animation: right-pose 2.4s ease-in-out infinite; }
    @keyframes left-pose { 0%, 42%, 100% { opacity: 1 } 52%, 90% { opacity: 0 } }
    @keyframes right-pose { 0%, 42%, 100% { opacity: 0 } 52%, 90% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .left,.right { animation:none } .left { opacity:1 } .right { opacity:0 } }
  </style>
  <rect width="320" height="180" rx="24" fill="#18211b"/>
  <path d="M55 151H265" stroke="#4d6355" stroke-width="8" stroke-linecap="round"/>
  <circle cx="160" cy="39" r="18" fill="#d7ff62" stroke="#f6f7ef" stroke-width="4"/>
  <circle cx="153" cy="37" r="2.5" fill="#18211b"/>
  <path d="M160 58L160 101" stroke="#f6f7ef" stroke-width="18" stroke-linecap="round"/>
  <circle cx="160" cy="101" r="8" fill="#d7ff62" stroke="#f6f7ef" stroke-width="2"/>
  <g class="left">
    <path d="M157 100L143 124L139 148M164 101L183 112L171 126" fill="none" stroke="#f6f7ef" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="183" cy="112" r="5" fill="#8fd8ff"/>
    <path d="M156 67L180 99L174 115M164 67L190 96L184 112" fill="none" stroke="#f6f7ef" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="174" cy="117" rx="8" ry="5" fill="#8fd8ff" stroke="#f6f7ef" stroke-width="2"/>
    <ellipse cx="136" cy="149" rx="14" ry="5" fill="#d7ff62" stroke="#f6f7ef" stroke-width="2"/>
  </g>
  <g class="right" opacity="0" transform="translate(320 0) scale(-1 1)">
    <path d="M157 100L143 124L139 148M164 101L183 112L171 126" fill="none" stroke="#f6f7ef" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="183" cy="112" r="5" fill="#8fd8ff"/>
    <path d="M156 67L180 99L174 115M164 67L190 96L184 112" fill="none" stroke="#f6f7ef" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="174" cy="117" rx="8" ry="5" fill="#8fd8ff" stroke="#f6f7ef" stroke-width="2"/>
    <ellipse cx="136" cy="149" rx="14" ry="5" fill="#d7ff62" stroke="#f6f7ef" stroke-width="2"/>
  </g>
  <path d="M112 155H146M174 155H208" stroke="#8fd8ff" stroke-width="3" stroke-linecap="round" opacity=".8"/>
</svg>
