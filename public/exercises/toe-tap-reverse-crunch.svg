<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="title desc">
  <title id="title">Animated toe tap to reverse crunch</title>
  <desc id="desc">A supine figure alternates between tapping bent legs toward the floor and curling the pelvis into a small reverse crunch.</desc>
  <style>
    .tap { animation: tap-pose 2.6s ease-in-out infinite; }
    .curl { animation: curl-pose 2.6s ease-in-out infinite; }
    @keyframes tap-pose { 0%, 42%, 100% { opacity:1 } 52%, 90% { opacity:0 } }
    @keyframes curl-pose { 0%, 42%, 100% { opacity:0 } 52%, 90% { opacity:1 } }
    @media (prefers-reduced-motion: reduce) { .tap,.curl { animation:none } .tap { opacity:1 } .curl { opacity:0 } }
  </style>
  <rect width="320" height="180" rx="24" fill="#18211b"/>
  <path d="M28 149H292" stroke="#4d6355" stroke-width="8" stroke-linecap="round"/>
  <circle cx="63" cy="126" r="18" fill="#d7ff62" stroke="#f6f7ef" stroke-width="4"/>
  <path d="M81 130L151 135M102 134L126 145" fill="none" stroke="#f6f7ef" stroke-width="14" stroke-linecap="round"/>
  <ellipse cx="134" cy="146" rx="15" ry="6" fill="#8fd8ff" stroke="#f6f7ef" stroke-width="2"/>
  <g class="tap">
    <path d="M151 135L190 113L224 143M190 113L225 120L253 144" fill="none" stroke="#f6f7ef" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="190" cy="113" r="7" fill="#d7ff62" stroke="#f6f7ef" stroke-width="2"/>
    <ellipse cx="232" cy="146" rx="14" ry="5" fill="#d7ff62" stroke="#f6f7ef" stroke-width="2"/>
    <ellipse cx="260" cy="146" rx="14" ry="5" fill="#d7ff62" stroke="#f6f7ef" stroke-width="2"/>
  </g>
  <g class="curl" opacity="0">
    <path d="M151 128L184 92L215 70M184 92L215 95L244 78" fill="none" stroke="#f6f7ef" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="184" cy="92" r="7" fill="#d7ff62" stroke="#f6f7ef" stroke-width="2"/>
    <ellipse cx="227" cy="65" rx="15" ry="6" fill="#d7ff62" stroke="#f6f7ef" stroke-width="2" transform="rotate(-28 227 65)"/>
    <ellipse cx="256" cy="72" rx="15" ry="6" fill="#d7ff62" stroke="#f6f7ef" stroke-width="2" transform="rotate(-18 256 72)"/>
  </g>
  <path d="M258 117C274 99 267 76 247 62" fill="none" stroke="#8fd8ff" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 7"/>
</svg>
