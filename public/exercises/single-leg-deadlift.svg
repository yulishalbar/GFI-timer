<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="title desc">
  <title id="title">Animated single-leg deadlift to knee tuck</title>
  <desc id="desc">A figure alternates between a balanced forward hinge and a tall knee-tuck position.</desc>
  <style>
    .hinge { animation: hinge-pose 2.8s ease-in-out infinite; }
    .tuck { animation: tuck-pose 2.8s ease-in-out infinite; }
    @keyframes hinge-pose { 0%, 42%, 100% { opacity:1 } 52%, 90% { opacity:0 } }
    @keyframes tuck-pose { 0%, 42%, 100% { opacity:0 } 52%, 90% { opacity:1 } }
    @media (prefers-reduced-motion: reduce) { .hinge,.tuck { animation:none } .hinge { opacity:1 } .tuck { opacity:0 } }
  </style>
  <rect width="320" height="180" rx="24" fill="#18211b"/>
  <path d="M35 151H285" stroke="#4d6355" stroke-width="8" stroke-linecap="round"/>
  <g class="hinge">
    <circle cx="93" cy="66" r="17" fill="#d7ff62" stroke="#f6f7ef" stroke-width="4"/>
    <path d="M109 72L158 98M130 83L111 125M139 88L127 131M158 98L151 148M159 98L235 79" fill="none" stroke="#f6f7ef" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="158" cy="98" r="7" fill="#d7ff62" stroke="#f6f7ef" stroke-width="2"/>
    <ellipse cx="147" cy="150" rx="14" ry="5" fill="#d7ff62" stroke="#f6f7ef" stroke-width="2"/>
    <ellipse cx="249" cy="76" rx="15" ry="5" fill="#d7ff62" stroke="#f6f7ef" stroke-width="2" transform="rotate(-12 249 76)"/>
    <ellipse cx="111" cy="129" rx="8" ry="5" fill="#8fd8ff" stroke="#f6f7ef" stroke-width="2"/>
  </g>
  <g class="tuck" opacity="0">
    <circle cx="160" cy="38" r="17" fill="#d7ff62" stroke="#f6f7ef" stroke-width="4"/>
    <path d="M160 56L160 100M159 67L182 101M161 100L151 148M163 100L187 112L175 130" fill="none" stroke="#f6f7ef" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="187" cy="112" r="6" fill="#8fd8ff"/>
    <ellipse cx="147" cy="150" rx="14" ry="5" fill="#d7ff62" stroke="#f6f7ef" stroke-width="2"/>
    <ellipse cx="175" cy="132" rx="12" ry="5" fill="#d7ff62" stroke="#f6f7ef" stroke-width="2"/>
  </g>
  <path d="M208 49C226 65 226 94 210 110" fill="none" stroke="#8fd8ff" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 7"/>
</svg>
