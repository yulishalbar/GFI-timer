<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="title desc">
  <title id="title">Animated side-lying leg lift</title>
  <desc id="desc">A side-lying figure keeps the hips stacked while the straight top leg lifts and lowers.</desc>
  <style>
    .lift { animation: lift-pose 2.3s ease-in-out infinite; }
    .lower { animation: lower-pose 2.3s ease-in-out infinite; }
    @keyframes lift-pose { 0%, 42%, 100% { opacity:1 } 52%, 90% { opacity:0 } }
    @keyframes lower-pose { 0%, 42%, 100% { opacity:0 } 52%, 90% { opacity:1 } }
    @media (prefers-reduced-motion: reduce) { .lift,.lower { animation:none } .lift { opacity:1 } .lower { opacity:0 } }
  </style>
  <rect width="320" height="180" rx="24" fill="#18211b"/>
  <path d="M28 149H292" stroke="#4d6355" stroke-width="8" stroke-linecap="round"/>
  <circle cx="69" cy="113" r="18" fill="#d7ff62" stroke="#f6f7ef" stroke-width="4"/>
  <path d="M86 119L157 128M88 120L113 143M157 128L221 143" fill="none" stroke="#f6f7ef" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M74 128L98 143" stroke="#f6f7ef" stroke-width="9" stroke-linecap="round"/>
  <ellipse cx="105" cy="146" rx="14" ry="6" fill="#8fd8ff" stroke="#f6f7ef" stroke-width="2"/>
  <ellipse cx="236" cy="145" rx="16" ry="6" fill="#d7ff62" stroke="#f6f7ef" stroke-width="2"/>
  <circle cx="157" cy="128" r="7" fill="#d7ff62" stroke="#f6f7ef" stroke-width="2"/>
  <g class="lift">
    <path d="M157 125L229 84" stroke="#f6f7ef" stroke-width="14" stroke-linecap="round"/>
    <ellipse cx="244" cy="76" rx="16" ry="6" fill="#d7ff62" stroke="#f6f7ef" stroke-width="2" transform="rotate(-28 244 76)"/>
  </g>
  <g class="lower" opacity="0">
    <path d="M157 125L229 126" stroke="#f6f7ef" stroke-width="14" stroke-linecap="round"/>
    <ellipse cx="245" cy="126" rx="16" ry="6" fill="#d7ff62" stroke="#f6f7ef" stroke-width="2"/>
  </g>
  <path d="M250 112C265 100 264 82 250 68" fill="none" stroke="#8fd8ff" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 7"/>
</svg>
