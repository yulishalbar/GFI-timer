<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Single-leg deadlift to knee tuck on the right side</title>
  <desc id="desc">A realistic instructor alternates between a single-leg deadlift hinge and a standing knee tuck.</desc>
  <style>
    .hinge { animation: hinge-frame 3.2s ease-in-out infinite; }
    .tuck { animation: tuck-frame 3.2s ease-in-out infinite; }
    @keyframes hinge-frame { 0%, 40%, 100% { opacity: 1 } 50%, 90% { opacity: 0 } }
    @keyframes tuck-frame { 0%, 40%, 100% { opacity: 0 } 50%, 90% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) {
      .hinge, .tuck { animation: none; }
      .hinge { opacity: 1; }
      .tuck { opacity: 0; }
    }
  </style>
  <rect width="800" height="800" rx="28" fill="#18211b"/>
  <image class="hinge" href="single-leg-deadlift-hinge.jpg" width="800" height="800"/>
  <image class="tuck" href="single-leg-deadlift-knee-tuck.jpg" width="800" height="800" opacity="0"/>
</svg>
