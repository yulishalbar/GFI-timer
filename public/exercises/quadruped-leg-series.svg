<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="title desc">
  <title id="title">Animated quadruped leg extension and side crunch</title>
  <desc id="desc">A tabletop figure alternates between extending one leg straight behind and drawing that knee toward the same-side elbow.</desc>
  <style>
    .extend { animation: extend-pose 2.5s ease-in-out infinite; }
    .crunch { animation: crunch-pose 2.5s ease-in-out infinite; }
    @keyframes extend-pose { 0%, 42%, 100% { opacity:1 } 52%, 90% { opacity:0 } }
    @keyframes crunch-pose { 0%, 42%, 100% { opacity:0 } 52%, 90% { opacity:1 } }
    @media (prefers-reduced-motion: reduce) { .extend,.crunch { animation:none } .extend { opacity:1 } .crunch { opacity:0 } }
  </style>
  <rect width="320" height="180" rx="24" fill="#18211b"/>
  <path d="M28 149H292" stroke="#4d6355" stroke-width="8" stroke-linecap="round"/>
  <circle cx="89" cy="74" r="17" fill="#d7ff62" stroke="#f6f7ef" stroke-width="4"/>
  <path d="M106 78L177 99M116 84L105 115L99 143M130 88L126 117L122 143M177 99L165 143" fill="none" stroke="#f6f7ef" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="177" cy="99" r="8" fill="#d7ff62" stroke="#f6f7ef" stroke-width="2"/>
  <ellipse cx="96" cy="146" rx="14" ry="6" fill="#8fd8ff" stroke="#f6f7ef" stroke-width="2"/>
  <ellipse cx="119" cy="146" rx="14" ry="6" fill="#8fd8ff" stroke="#f6f7ef" stroke-width="2"/>
  <ellipse cx="162" cy="146" rx="14" ry="6" fill="#d7ff62" stroke="#f6f7ef" stroke-width="2"/>
  <g class="extend">
    <path d="M177 100L245 102" stroke="#f6f7ef" stroke-width="14" stroke-linecap="round"/>
    <circle cx="245" cy="102" r="6" fill="#8fd8ff"/>
    <ellipse cx="263" cy="102" rx="17" ry="6" fill="#d7ff62" stroke="#f6f7ef" stroke-width="2"/>
  </g>
  <g class="crunch" opacity="0">
    <path d="M177 100L206 118L187 132" fill="none" stroke="#f6f7ef" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="206" cy="118" r="6" fill="#8fd8ff"/>
    <ellipse cx="181" cy="134" rx="13" ry="6" fill="#d7ff62" stroke="#f6f7ef" stroke-width="2"/>
  </g>
  <path d="M232 75C244 91 238 117 218 129" fill="none" stroke="#8fd8ff" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 7"/>
</svg>
