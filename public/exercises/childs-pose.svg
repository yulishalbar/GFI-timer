<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="title desc">
  <title id="title">Child's pose</title>
  <desc id="desc">Detailed side view of a person in child's pose, with hands and feet clearly shown on the mat.</desc>
  <rect width="320" height="180" rx="24" fill="#18211b"/>
  <path d="M28 149H292" stroke="#4d6355" stroke-width="8" stroke-linecap="round"/>

  <!-- back leg, foot, and hip -->
  <path d="M188 111C205 113 216 124 224 136C213 144 197 147 178 147" fill="none" stroke="#d8ded9" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M178 147C164 148 155 146 149 142C160 138 170 137 182 139Z" fill="#d7ff62" stroke="#f6f7ef" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="190" cy="111" r="10" fill="#d7ff62" stroke="#f6f7ef" stroke-width="3"/>

  <!-- torso and shoulder -->
  <path d="M190 109C163 94 132 92 104 103" fill="none" stroke="#f6f7ef" stroke-width="22" stroke-linecap="round"/>
  <path d="M184 102C160 94 134 94 113 101" fill="none" stroke="#8fd8ff" stroke-width="4" stroke-linecap="round" opacity=".85"/>
  <circle cx="105" cy="105" r="9" fill="#d7ff62" stroke="#f6f7ef" stroke-width="3"/>

  <!-- far arm -->
  <path d="M109 109L77 129L46 141" fill="none" stroke="#aeb8b1" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="77" cy="129" r="5" fill="#8fd8ff"/>
  <ellipse cx="39" cy="143" rx="14" ry="6" fill="#8fd8ff" stroke="#f6f7ef" stroke-width="2"/>

  <!-- near arm and articulated hand -->
  <path d="M103 106L69 126L34 138" fill="none" stroke="#f6f7ef" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="69" cy="126" r="6" fill="#8fd8ff" stroke="#f6f7ef" stroke-width="2"/>
  <ellipse cx="29" cy="140" rx="15" ry="7" fill="#8fd8ff" stroke="#f6f7ef" stroke-width="2"/>
  <path d="M17 137L8 135M18 141L8 141M19 145L10 147" stroke="#f6f7ef" stroke-width="2.5" stroke-linecap="round"/>

  <!-- head with face direction -->
  <circle cx="88" cy="104" r="19" fill="#d7ff62" stroke="#f6f7ef" stroke-width="4"/>
  <path d="M76 110C80 116 88 119 97 116" fill="none" stroke="#18211b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="78" cy="103" r="2.5" fill="#18211b"/>
  <path d="M71 108L64 111L72 113" fill="none" stroke="#18211b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- contact cues -->
  <path d="M14 153H53M146 153H188" stroke="#8fd8ff" stroke-width="3" stroke-linecap="round" opacity=".8"/>
</svg>
